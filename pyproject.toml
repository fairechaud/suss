[project]
name = "suss"
version = "0.2.0"
description = "CLI tool for cataloguing test cases and test suites"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "rich",
  "linktoolsapi @ file:///C:/dev/linkalbatrosslibraries/linktoolsapi/"
  ]

[project.scripts]
suss = "suss.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=68"]
build-backed = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ruff>=0.14.14",
    "pytest>=8.0.0",
]
